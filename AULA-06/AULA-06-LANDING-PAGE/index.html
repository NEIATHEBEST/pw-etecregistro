<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Café Aroma - Os melhores Cafés Especiais</title>
    <!-- Importação do CSS-->
    <link rel="stylesheet" href ="styles.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="nav">
                <div class="logo">Café Aroma</div>
                <nav class="menu">
                    <a href="#inicio">Ínicio</a>
                    <a href="#produtos">Produtos</a>
                    <a href="#sobre">Sobre</a>
                    <a href="#contato">Contato</a>
                </nav>
            </div>
        </div>
    </header>
    <main>
        <section class="hero">
            <div class="hero-conten">
                <h1>Desperte Seus Sentidos</h1>
                <p>
                    Cafés especiais selecionados para você começar o dia com energia e sabOUR
                </p>
                <button>
                    Conheça Nossos Cafés
                </button>
            </div>
        </section>
        <section class="produtos" id="produtos">
            <div class="container">
                <h2 class="section-title">Nossos Cafés</h2>
                <div class="cards">
                    <div class="card">
                        <img src="COLAR AQUI IMAGEM 01" alt="">
                        <div class="card-content">
                            <h3>Expresso Intenso</h3>
                            <p>Sabor marcante e encorpado, perfeito para quem aprecia café forte</p>
                            <span class="price">R$ 18,90</span>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>
    
</body>
</html>
